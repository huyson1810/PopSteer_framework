# Joint user + item SAE (SASRec_JSAE) on a frozen SASRec d = 64 backbone; used by the variants UI-S and UI-R.
# Each modality is standardised with its own mean and scalar scale before the shared SAE.
# Backbone settings repeat bb_sasrec_d64.yaml so the data split is identical.
# Per-run command-line overrides: --base_path=<absolute path to the backbone .pth> --sae_scale_size=<s> --sae_k=<K>
n_layers: 2
n_heads: 2
hidden_size: 64
inner_size: 256
hidden_dropout_prob: 0.5
attn_dropout_prob: 0.5
hidden_act: 'gelu'
layer_norm_eps: 1e-12
initializer_range: 0.02
loss_type: 'CE'
MAX_ITEM_LIST_LENGTH: 50
normalize_all: True
load_col:
  inter: [user_id, item_id, rating, timestamp]
eval_args:
  split: {'LS': 'valid_and_test'}
  order: TO
  group_by: user
  mode: full
seed: 2020
reproducibility: True

# SAE
input_dim: 64                   # = backbone hidden size
sae_scale_size: 32              # paper grid s in {32, 64}
sae_k: 44                       # paper grid K in {36, 44, 52}
learner: adam
learning_rate: 0.01             # initial learning rate of ReduceLROnPlateau
train_batch_size: 2048
eval_batch_size: 4096
epochs: 300
stopping_step: 10
sae_lr_patience: 10             # ReduceLROnPlateau patience (code default 20)
steer: 0
analyze: False
alpha: 1.0
topk: [10]
checkpoint_dir: saved
valid_metric: SAE_Loss_total     # early stopping on the validation reconstruction loss, users + items (smaller = better)
valid_metric_bigger: False
metrics: ["NDCG", "GiniIndex", "AveragePopularity", "ItemCoverageN", "UPD", "SAE_Loss_u", "SAE_Loss_i", "SAE_Loss_total"]
