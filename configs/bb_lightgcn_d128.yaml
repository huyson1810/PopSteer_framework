# Backbone: LightGCN (d = 128), random 80/10/10 split of each user's interactions, BPR loss.
embedding_size: 128
n_layers: 2
reg_weight: 1e-05

learner: adam
learning_rate: 0.001
train_batch_size: 2048
eval_batch_size: 4096
epochs: 300
stopping_step: 10               # early-stopping patience
valid_metric: NDCG@10
topk: [10]
seed: 2020
reproducibility: True

eval_args:                      # random 80/10/10 split per user
  split: {'RS': [0.8, 0.1, 0.1]}
  order: RO
  group_by: user
  mode: full
train_neg_sample_args:
  distribution: uniform
  sample_num: 1
  alpha: 1.0
  dynamic: False
  candidate_num: 0
load_col:
  inter: [user_id, item_id]
user_inter_num_interval: "[0,inf)"
item_inter_num_interval: "[0,inf)"

checkpoint_dir: saved           # relative to the working folder
metrics: ["Recall", "NDCG", "Hit", "GiniIndex", "AveragePopularity", "ItemCoverage", "ItemCoverageN", "UPD"]
