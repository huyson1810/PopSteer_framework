# PopSteer environment, locked with uv for Linux x86_64 + CUDA 12.8 (see README.md, Installation).
#   uv sync --locked            # creates .venv from uv.lock
# Pins: torch==2.11.0 from the PyTorch cu128 index, numpy<2 and pandas<3
# (RecBole 1.2.1 predates both major versions). Other platforms: use the pip route in README.md.
[project]
name = "popsteer"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.11.0",
    "numpy>=1.17.2,<2",
    "scipy>=1.6.0",
    "pandas>=1.3.0,<3",
    "hyperopt==0.2.5",
    "tqdm>=4.48.2",
    "scikit-learn>=0.23.2",
    "pyyaml>=5.1.0",
    "colorlog>=4.7.2",
    "colorama>=0.4.4",
    "tensorboard>=2.5.0",
    "thop",
    "ray[tune]",
    "tabulate>=0.8.10",
    "plotly>=4.0.0",
    "texttable>=0.9.0",
    "psutil>=5.9.0",
    "matplotlib",
    "h5py",
    "umap-learn",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
